<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>studiomurena.net</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/vga-437');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --teal: #008080; --win-gray: #c0c0c0; --win-blue: #000080;
            --win-light: #ffffff; --win-dark: #000000;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; background-color: #000; font-family: 'VGA 437', monospace;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        .win95-border {
            background-color: var(--win-gray);
            border-top: 2px solid var(--win-light); border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-dark); border-bottom: 2px solid var(--win-dark);
            box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
        }

        .ig-stories-poster {
            height: 100vh; width: 100vw; max-width: 600px;
            background-color: var(--teal); display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }

        /* DESKTOP */
        .desktop { flex-grow: 1; position: relative; z-index: 10; }
        .desktop-icon {
            position: absolute; width: 80px; text-align: center; color: white; font-size: 11px;
            cursor: pointer; text-shadow: 1px 1px #000; padding: 5px;
        }
        .icon-art { font-size: 32px; display: block; margin-bottom: 5px; }

        #icon-internet { top: 20px; left: 20px; }
        #icon-game { top: 110px; left: 20px; }
        #icon-fighter { top: 20px; left: 110px; }

        /* HEADER BROWSER */
        .main-title {
            margin: 15px auto; font-family: 'Press Start 2P', monospace;
            font-size: 5vw; text-align: center; text-transform: lowercase;
            animation: colorCycle 2s infinite alternate;
        }
        @keyframes colorCycle { 0% { color: #000080; } 100% { color: #00ffff; } }

        /* TASKBAR */
        .taskbar {
            height: 35px; background: var(--win-gray); border-top: 2px solid var(--win-light);
            display: flex; align-items: center; padding: 0 5px; z-index: 100;
        }
        .start-btn { border: 2px solid; border-color: #fff #000 #000 #fff; padding: 2px 6px; font-weight: bold; }

        /* SLOT WINDOW */
        #game-window {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; z-index: 200; padding: 10px;
        }
        .title-bar { background: var(--win-blue); color: #fff; padding: 3px 8px; display: flex; justify-content: space-between; }
        .slot-grid { display: flex; gap: 5px; justify-content: center; margin: 15px 0; }
        .box { width: 50px; height: 50px; background: #fff; border: 2px solid #000; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    </style>
</head>
<body>

<div class="ig-stories-poster">
    <div class="desktop">
        <div class="main-title">studiomurena.net</div>

        <div class="desktop-icon" id="icon-internet" onclick="alert('IE 4.0: Connection Error')">
            <span class="icon-art">🌐</span>Internet
        </div>
        <div class="desktop-icon" id="icon-game" onclick="document.getElementById('game-window').style.display='block'">
            <span class="icon-art">🎰</span>SLOT
        </div>
        <div class="desktop-icon" id="icon-fighter" onclick="window.location.href='fighter.html'">
            <span class="icon-art">👊</span>FIGHTER
        </div>

        <div id="game-window" class="win95-border">
            <div class="title-bar"><span>MurenaSlot.exe</span><span onclick="this.parentElement.parentElement.style.display='none'">[X]</span></div>
            <div style="padding: 10px; text-align: center;">
                <input type="email" id="email" placeholder="tua@email.com" style="width: 80%; margin-bottom: 10px;">
                <button onclick="playSlot()" class="start-btn">GIOCA</button>
                <div id="slot-msg" style="font-size: 10px; margin-top: 10px;">Inserisci email per iniziare</div>
                <div class="slot-grid" id="grid">
                    <div class="box">?</div><div class="box">?</div><div class="box">?</div><div class="box">?</div><div class="box">?</div>
                </div>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-btn">Start</div>
        <div style="margin-left: auto; font-size: 12px;" id="clock">18:06</div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyPDTQQC8DRlmyy_D8ZYnA95ezto5V_6891Sp9RceoqaCXAYxUGBB0KYtWRk9qEhLkr/exec';
    
    async function playSlot() {
        const mail = document.getElementById('email').value;
        if(!mail.includes('@')) return alert('Email non valida');
        document.getElementById('slot-msg').innerText = "Connessione al server...";
        
        try {
            const res = await fetch(scriptURL + "?email=" + encodeURIComponent(mail));
            const data = await res.json();
            document.getElementById('slot-msg').innerText = "Match trovato! Clicca i box.";
            const boxes = document.querySelectorAll('.box');
            boxes.forEach((b, i) => {
                b.onclick = () => {
                    b.innerText = data.id === 'lose' ? ["❌","💀","🎲"][Math.floor(Math.random()*3)] : data.icon;
                    b.style.backgroundColor = "#eee";
                };
            });
        } catch(e) { alert("Errore server"); }
    }

    setInterval(() => {
        const n = new Date();
        document.getElementById('clock').innerText = n.getHours().toString().padStart(2,'0')+":"+n.getMinutes().toString().padStart(2,'0');
    }, 1000);
</script>

</body>
</html>

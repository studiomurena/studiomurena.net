<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Musical Fighters - Murena Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body { 
            background: #000; margin: 0; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh; overflow: hidden; 
            font-family: 'Press Start 2P', cursive; color: #fff; touch-action: none;
            user-select: none;
        }

        #header-bar {
            width: 100%; background: #c0c0c0; border-bottom: 3px solid #000;
            padding: 10px; display: flex; justify-content: space-between; align-items: center;
            color: #000; font-size: 10px; box-sizing: border-box; z-index: 20;
        }

        .win-btn {
            background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff;
            padding: 5px 10px; text-decoration: none; color: #000; font-size: 9px; cursor: pointer;
        }

        #game-container {
            position: relative; width: 100vw; height: calc(100vw * 9/16); 
            max-width: 800px; max-height: 450px; background: #222; overflow: hidden;
            border: 4px solid #c0c0c0;
        }

        canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }

        #selection-screen {
            position: absolute; inset: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; text-align: center;
        }

        .bg-select-ch { background-color: #000080; background-image: url('assets/bkg1.png'); background-size: cover; }
        .bg-select-en { background-color: #500000; background-image: url('assets/bkg2.png'); background-size: cover; }
        .bg-select-am { background-color: #000; background-image: url('assets/bkg3.png'); background-size: cover; }

        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; max-width: 500px; padding: 0 10px; }
        .cell {
            width: 50px; height: 50px; background-color: #222; border: 3px solid #808080;
            cursor: pointer; background-size: 500%; image-rendering: pixelated;
        }
        .cell.locked { opacity: 0.5; cursor: not-allowed; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .cell.locked::after { content: "🔒"; }

        .scrolling-grid {
            display: flex; overflow-x: auto; gap: 12px; width: 90%; max-width: 700px; padding: 15px 5px;
        }

        .stage-cell {
            flex: 0 0 130px; height: 80px; border: 3px solid #808080; background-size: cover; position: relative; cursor: pointer;
        }
        .stage-name { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); font-size: 7px; text-align: center; padding: 4px 0; }

        .overlay {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 15; text-align: center; visibility: hidden;
        }

        #round-msg {
            position: absolute; top: 40%; width: 100%; text-align: center;
            font-size: 24px; color: #fff; text-shadow: 2px 2px #f00; z-index: 5;
            visibility: hidden; pointer-events: none;
        }

        #controls {
            display: flex; justify-content: space-between; width: 100%; max-width: 800px;
            padding: 15px; background: #1a1a1a; border-top: 4px solid #333; visibility: hidden;
        }

        .d-pad { display: grid; grid-template-columns: 55px 55px 55px; gap: 5px; }
        .joy-btn {
            width: 55px; height: 55px; background: #333; border: 4px solid #555; 
            display: flex; align-items: center; justify-content: center; border-radius: 8px;
        }
        .action-buttons { display: flex; gap: 15px; }
        .action-btn {
            width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; font-size: 10px; border: 2px solid #000; box-shadow: 0 6px 0 #000;
        }
        .action-btn.blue { background: #3a7bd5; }
        .action-btn.red { background: #ff4b4b; }
    </style>
</head>
<body>

<div id="header-bar">
    <button class="win-btn" onclick="window.location.href='index.html'">← DESKTOP</button>
    <span id="top-msg">STUDIO MURENA: SELECT HERO</span>
    <button class="win-btn" id="btn-pause" style="display: none;" onclick="togglePause()">II PAUSE</button>
</div>

<div id="game-container">
    <div id="selection-screen" class="bg-select-ch">
        <div id="grid" class="grid"></div>
        <div id="char-name" style="margin-top: 20px; color: #ffcc00; text-shadow: 2px 2px #000;">SELECT HERO</div>
    </div>
    
    <div id="round-msg">ROUND 1</div>

    <div id="pause-screen" class="overlay">
        <h1>PAUSED</h1>
        <button class="win-btn" onclick="togglePause()">RESUME</button>
        <button class="win-btn" style="margin-top:10px" onclick="resetToMenu()">MENU</button>
    </div>

    <div id="end-screen" class="overlay">
        <h1 id="end-title">YOU WIN!</h1>
        <button class="win-btn" onclick="handleEndScreen()">CONTINUE</button>
    </div>

    <div id="unlock-screen" class="overlay">
        <h1>NEW UNLOCK!</h1>
        <p id="unlock-text" style="padding:20px; font-size:12px; line-height:1.5;"></p>
        <button class="win-btn" onclick="resetToMenu()">AWESOME!</button>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<div id="controls">
    <div class="d-pad">
        <div class="joy-btn" id="btn-j">▲</div>
        <div class="joy-btn" id="btn-l">◄</div>
        <div class="joy-btn" id="btn-r">►</div>
    </div>
    <div class="action-buttons">
        <div class="action-btn blue" id="btn-d">DODGE</div>
        <div class="action-btn red" id="btn-a">ATK</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // --- ENGINE AUDIO ---
    const menuMusic = new Audio('assets/Jazzhighlanders_8bit_F.wav'); menuMusic.loop = true; menuMusic.volume = 0.3;
    const stageMusic = new Audio(); stageMusic.loop = true; stageMusic.volume = 0.2;

    const sfxFiles = {
        r1: 'assets/round-one-fight.mp3', r2: 'assets/round-two-fight.mp3', r3: 'assets/final-round-fight.mp3',
        win: 'assets/youwin.mp3', lose: 'assets/youloose.mp3'
    };

    function playSfx(key) {
        const a = new Audio(sfxFiles[key]); a.volume = 1.0; a.play().catch(()=>{});
    }

    let audioUnlocked = false;
    function unlockAudio() {
        if (audioUnlocked) return;
        menuMusic.play().then(() => { if(mode!=="SELECT") menuMusic.pause(); });
        audioUnlocked = true;
    }
    document.addEventListener('click', unlockAudio, { once: true });
    document.addEventListener('touchstart', unlockAudio, { once: true });

    function playCharSfx(spriteId, action) {
        let name = `${spriteId}-${action}`;
        if (spriteId === 'orologioman') name = `chronomutant-${action}`;
        if (spriteId === 'radioman') name = (action === 'hurt') ? 'freq-ghoul--hurt' : `freq-ghoul-${action}`;
        if (spriteId === 'britney' && (action === 'select' || action === 'win')) name = 'britney-bitch';
        if (spriteId === 'doom' && (action === 'select' || action === 'win')) name = 'doom-not-surrender';

        const a = new Audio(`assets/${name}.mp3`); a.volume = 1.0; a.play().catch(()=>{});
    }

    // --- DATI ---
    const imageCache = {};
    function getImage(src) { if (!imageCache[src]) { const img = new Image(); img.src = src; imageCache[src] = img; } return imageCache[src]; }

    let totalWins = parseInt(sessionStorage.getItem('murenaWins') || '0');
    let mode = "SELECT", selectState = 0, p1Char, cpuChar, currentStage, matchTimer = 99, frames = 0, currentRound = 1, p1Wins = 0, cpuWins = 0, pendingUnlock = "";

    const heroes = [
        { id: 'carma2', n: 'CARMA', r: 0 }, { id: 'ferraz2', n: 'FERRAZ', r: 0 }, { id: 'nan2', n: 'NAN', r: 0 },
        { id: 'mauri2', n: 'MAURI', r: 0 }, { id: 'falcon2', n: 'FALCON', r: 0 }, { id: 'ljs', n: 'L.J. SILVER', r: 1 },
        { id: 'mclovin', n: 'MCLOVIN', r: 2 }, { id: 'britney', n: 'BRITNEY', r: 3 }, { id: 'mfdoom', n: 'MF DOOM', r: 4 }
    ];
    const enemiesList = [
        { id: 'baba', n: 'BABA', r: 0 }, { id: 'beeman', n: 'BEEMAN', r: 0 }, { id: 'orologioman', n: 'CHRONO', r: 0 },
        { id: 'radioman', n: 'FREQ', r: 0 }, { id: 'murena', n: 'MURENA', r: 1 }, { id: 'pigeon', n: 'PIGEON', r: 2 },
        { id: 'ornitorincoman', n: 'ORNITORINCO', r: 3 }, { id: 'doom', n: 'DOOM', r: 4 }
    ];
    const stages = [
        { n: 'RUSTWATER', b: 'assets/metro.gif', m: 'assets/rustwater.mp3' },
        { n: 'COLLAPSE', b: 'assets/buconero.gif', m: 'assets/collapsepoint.mp3' },
        { n: 'RAIN RED', b: 'assets/rainred.gif', m: 'assets/rainred.mp3' },
        { n: 'FLAMES', b: 'assets/onfire.gif', m: 'assets/flamesupstairs.mp3' },
        { n: 'EAST END', b: 'assets/rain.gif', m: 'assets/eastendrain.mp3' },
        { n: 'BARRIER', b: 'assets/railway.gif', m: 'assets/emptybarrier.mp3' },
        { n: 'MADLANDS', b: 'assets/madmax.gif', m: 'assets/badlands.mp3' },
        { n: 'JUNGLE', b: 'assets/jungla.gif', m: 'assets/junglecrashland.mp3' },
        { n: 'SEA GLASS', b: 'assets/acquario.gif', m: 'assets/seaglass.mp3' },
        { n: 'HARBOR', b: 'assets/barchette.gif', m: 'assets/fishingharbor.mp3' },
        { n: 'PLATFORM 7', b: 'assets/treni.gif', m: 'assets/platform7.mp3' },
        { n: 'FORTUNE', b: 'assets/maga.gif', m: 'assets/fortunesend.mp3' },
        { n: 'GATE', b: 'assets/airport.gif', m: 'assets/departuregate.mp3' },
        { n: 'LIONGATE', b: 'assets/china.gif', m: 'assets/lionsgate.mp3', z: 1.15 },
        { n: 'EMBER', b: 'assets/pirati.gif', m: 'assets/emberseas.mp3' },
        { n: 'FIESTA', b: 'assets/mexico.webp', m: 'assets/fiesta.mp3' }
    ];

    // --- INPUT ---
    const keys = { l:0, r:0, j:0, a:0, d:0 };
    const setupK = (id, k) => {
        const b = document.getElementById(id);
        b.ontouchstart = (e) => { e.preventDefault(); keys[k] = 1; };
        b.ontouchend = (e) => { e.preventDefault(); keys[k] = 0; };
        b.onmousedown = () => keys[k] = 1; b.onmouseup = () => keys[k] = 0;
    };
    setupK('btn-l','l'); setupK('btn-r','r'); setupK('btn-j','j'); setupK('btn-a','a'); setupK('btn-d','d');

    window.onkeydown = (e) => {
        if(e.code==='ArrowLeft') keys.l=1; if(e.code==='ArrowRight') keys.r=1;
        if(e.code==='ArrowUp') keys.j=1; if(e.code==='Space') keys.a=1;
        if(e.code==='ShiftLeft') keys.d=1;
    };
    window.onkeyup = (e) => {
        if(e.code==='ArrowLeft') keys.l=0; if(e.code==='ArrowRight') keys.r=0;
        if(e.code==='ArrowUp') keys.j=0; if(e.code==='Space') keys.a=0;
        if(e.code==='ShiftLeft') keys.d=0;
    };

    // --- LOGICA ---
    function loadSelectionScreen() {
        const grid = document.getElementById('grid'), screen = document.getElementById('selection-screen'), title = document.getElementById('char-name');
        grid.innerHTML = ''; canvas.style.backgroundImage = 'none';
        if (selectState === 0) {
            grid.className = 'grid'; screen.className = 'bg-select-ch'; title.innerText = 'SELECT HERO';
            heroes.forEach(h => {
                const c = document.createElement('div'); c.className = h.r <= totalWins ? 'cell' : 'cell locked';
                if(h.r <= totalWins) { 
                    c.style.backgroundImage = `url(assets/${h.id}-idle.png)`; 
                    c.onclick = () => { p1Char = h; playCharSfx(h.id, 'select'); selectState = 1; loadSelectionScreen(); }; 
                }
                grid.appendChild(c);
            });
        } else if (selectState === 1) {
            screen.className = 'bg-select-en'; title.innerText = 'SELECT OPPONENT';
            enemiesList.forEach(e => {
                const c = document.createElement('div'); c.className = e.r <= totalWins ? 'cell' : 'cell locked';
                if(e.r <= totalWins) { 
                    c.style.backgroundImage = `url(assets/${e.id}-idle.png)`; 
                    c.onclick = () => { cpuChar = e; playCharSfx(e.id, 'select'); selectState = 2; loadSelectionScreen(); }; 
                }
                grid.appendChild(c);
            });
        } else {
            grid.className = 'scrolling-grid'; screen.className = 'bg-select-am'; title.innerText = 'SELECT STAGE';
            stages.forEach(s => {
                const c = document.createElement('div'); c.className = 'stage-cell'; c.style.backgroundImage = `url(${s.b})`;
                c.innerHTML = `<div class="stage-name">${s.n}</div>`;
                c.onclick = () => { currentStage = s; startMatch(); };
                grid.appendChild(c);
            });
        }
    }

    function startMatch() {
        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('controls').style.visibility = 'visible';
        document.getElementById('btn-pause').style.display = 'block';
        menuMusic.pause(); stageMusic.src = currentStage.m; stageMusic.play().catch(()=>{});
        canvas.style.backgroundImage = `url(${currentStage.b})`;
        canvas.style.backgroundSize = currentStage.z ? `${currentStage.z*100}%` : 'cover';
        p1Wins = cpuWins = 0; currentRound = 1; startRound();
    }

    function startRound() {
        mode = "ROUND_OVER"; p1.hp = cpu.hp = 100; p1.x = 80; cpu.x = 430; p1.state = cpu.state = 'idle';
        matchTimer = 99; playSfx('r'+currentRound);
        const m = document.getElementById('round-msg'); m.innerText = `ROUND ${currentRound}`; m.style.visibility = 'visible';
        setTimeout(() => { m.innerText = "FIGHT!"; setTimeout(() => { m.style.visibility = 'hidden'; mode = "FIGHT"; }, 1000); }, 1500);
    }

    const SPRITE_SIZE = 290, GROUND_Y = 450;
    let p1 = { x: 80, y: GROUND_Y, hp: 100, state: 'idle', frame: 0, dir: 1, vy: 0, timer: 0, deadTimer: 0 };
    let cpu = { x: 430, y: GROUND_Y, hp: 100, state: 'idle', frame: 0, dir: -1, vy: 0, timer: 0, deadTimer: 0 };

    function drawFighter(f, id) {
        if (f.state === 'dead' && f.deadTimer > 40) return;
        let s = (f.state==='dodge'||f.state==='dead') ? 'idle' : f.state;
        let img = getImage(`assets/${id}-${s}.png`);
        if (!img.complete || img.naturalWidth === 0) img = getImage(`assets/${id}-idle.png`);
        if (!img.complete) return;

        const fw = img.width/5, fh = img.height/5;
        ctx.save();
        if (f.dir === -1) { ctx.translate(f.x + SPRITE_SIZE, f.y); ctx.scale(-1, 1); }
        else ctx.translate(f.x, f.y);

        if (f.state === 'hurt' || (f.state === 'dead' && f.deadTimer % 8 < 4)) {
            ctx.drawImage(img, (f.frame%5)*fw, Math.floor(f.frame/5)*fh, fw, fh, 0, -SPRITE_SIZE, SPRITE_SIZE, SPRITE_SIZE);
            ctx.globalCompositeOperation = "source-atop";
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            ctx.fillRect(0, -SPRITE_SIZE, SPRITE_SIZE, SPRITE_SIZE);
            ctx.globalCompositeOperation = "source-over";
        } else {
            if (f.state === 'dodge') ctx.globalAlpha = 0.5;
            if (f.state === 'dead') ctx.globalAlpha = Math.max(0, 1 - f.deadTimer/40);
            ctx.drawImage(img, (f.frame%5)*fw, Math.floor(f.frame/5)*fh, fw, fh, 0, -SPRITE_SIZE, SPRITE_SIZE, SPRITE_SIZE);
        }
        ctx.restore();
        if (Date.now()%100 < 50 && !['hurt','dodge','dead'].includes(f.state)) f.frame = (f.frame+1)%25;
    }

    function update() {
        if (mode !== "FIGHT") return;
        frames++; if(frames >= 60) { matchTimer--; frames = 0; }

        [p1, cpu].forEach((f, i) => {
            f.y += f.vy; if (f.y < GROUND_Y) f.vy += 1; else { f.y = GROUND_Y; f.vy = 0; }
            if (f.timer > 0) { f.timer--; if (f.timer <= 0) f.state = 'idle'; }
            if (f.hp <= 0) { 
                if(f.state!=='dead') { f.state='dead'; f.deadTimer=0; playCharSfx(i===0?p1Char.id:cpuChar.id, 'loose'); }
                f.deadTimer++; return; 
            }
            if (['hurt','dodge','attack'].includes(f.state)) return;

            if (i === 0) {
                if (keys.l) { f.x -= 6; f.state = 'run'; f.dir = -1; }
                else if (keys.r) { f.x += 6; f.state = 'run'; f.dir = 1; }
                else f.state = 'idle';
                if (keys.j && f.y >= GROUND_Y) f.vy = -16;
                if (keys.d) { f.state = 'dodge'; f.timer = 20; f.x -= f.dir*50; }
                else if (keys.a) { f.state = 'attack'; f.timer = 25; playCharSfx(p1Char.id, 'attack'); }
            } else {
                let d = p1.x - f.x; f.dir = d > 0 ? 1 : -1;
                if (Math.abs(d) > 185) { f.x += f.dir*3.5; f.state = 'run'; }
                else { 
                    f.state = 'idle'; 
                    if (Math.random() < 0.04) { f.state = 'attack'; f.timer = 25; playCharSfx(cpuChar.id, 'attack'); }
                }
            }
            f.x = Math.max(0, Math.min(800-SPRITE_SIZE, f.x));
        });

        // Hitbox
        [p1, cpu].forEach((at, i) => {
            let df = (i === 0) ? cpu : p1;
            if (at.state === 'attack' && at.timer === 15) {
                let r = (df.x - at.x) * at.dir;
                if (r > -60 && r < 190 && df.state !== 'dodge' && df.state !== 'hurt') {
                    df.state = 'hurt'; df.timer = 20; df.hp -= 15; df.x += at.dir*20;
                    playCharSfx(i===0?cpuChar.id:p1Char.id, 'hurt');
                }
            }
        });

        if (p1.hp <= 0 || cpu.hp <= 0 || matchTimer <= 0) {
            mode = "ROUND_OVER";
            let win = p1.hp > cpu.hp;
            if (win) p1Wins++; else cpuWins++;
            setTimeout(() => {
                if (p1Wins >= 2 || cpuWins >= 2) {
                    mode = "END"; stageMusic.pause();
                    let matchWin = p1Wins >= 2;
                    playSfx(matchWin ? 'win' : 'lose');
                    setTimeout(() => playCharSfx(matchWin ? p1Char.id : cpuChar.id, 'win'), 800);
                    document.getElementById('end-title').innerText = matchWin ? "YOU WIN!" : "GAME OVER";
                    if (matchWin) {
                        totalWins++; sessionStorage.setItem('murenaWins', totalWins);
                        if (totalWins === 1) pendingUnlock = "HERO: LONG JOHN SILVER\nENEMY: MURENA";
                        else if (totalWins === 2) pendingUnlock = "HERO: MCLOVIN\nENEMY: PIGEON";
                        else if (totalWins === 3) pendingUnlock = "HERO: BRITNEY\nENEMY: ORNITORINCO";
                        else if (totalWins === 4) pendingUnlock = "HERO: MF DOOM\nENEMY: DOOM";
                    }
                    document.getElementById('end-screen').style.visibility = 'visible';
                } else { currentRound++; startRound(); }
            }, 2000);
        }
    }

    function draw() {
        ctx.clearRect(0,0,800,450);
        if (mode !== "SELECT") {
            ctx.fillStyle = "red"; ctx.fillRect(50, 15, 300, 15); ctx.fillRect(450, 15, 300, 15);
            ctx.fillStyle = "yellow"; ctx.fillRect(50, 15, Math.max(0,p1.hp)*3, 15); ctx.fillRect(450+(300-Math.max(0,cpu.hp)*3), 15, Math.max(0,cpu.hp)*3, 15);
            ctx.fillStyle = "#fff"; ctx.font = "16px 'Press Start 2P'"; ctx.fillText(matchTimer, 385, 30);
            drawFighter(p1, p1Char.id); drawFighter(cpu, cpuChar.id);
        }
        requestAnimationFrame(draw);
    }

    function togglePause() { 
        if(mode==="FIGHT") { mode="PAUSE"; stageMusic.pause(); document.getElementById('pause-screen').style.visibility="visible"; }
        else if(mode==="PAUSE") { mode="FIGHT"; stageMusic.play(); document.getElementById('pause-screen').style.visibility="hidden"; }
    }
    function handleEndScreen() {
        document.getElementById('end-screen').style.visibility = "hidden";
        if (pendingUnlock !== "") {
            document.getElementById('unlock-text').innerText = pendingUnlock;
            document.getElementById('unlock-screen').style.visibility = "visible";
            pendingUnlock = "";
        } else resetToMenu();
    }
    function resetToMenu() {
        selectState = 0; mode = "SELECT"; stageMusic.pause();
        document.getElementById('controls').style.visibility = "hidden";
        document.getElementById('btn-pause').style.display = "none";
        document.getElementById('selection-screen').style.display = "flex";
        document.getElementById('unlock-screen').style.visibility = "hidden";
        loadSelectionScreen();
    }

    loadSelectionScreen(); draw(); setInterval(update, 1000/60);
</script>
</body>
</html>
